name: Package AutoSubs for Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build for (e.g. v3.11.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout AutoSubs Repo Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AutoSubs-App/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ================= 关键修复：自动安装 Vulkan SDK =================
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "vulkan-sdk.exe"
          Write-Host "Downloading Vulkan SDK from official latest URL..."
          
          # 使用官方的最新版下载链接，避开具体版本号带来的 404 问题
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile $installer
          
          Write-Host "Installing Vulkan SDK silently..."
          Start-Process -FilePath $installer -Args "--accept-licenses --default-answer --confirm-command install" -Wait
          
          # 安装完成后，动态查找实际的安装目录并设置环境变量
          $vulkanPath = Get-ChildItem "C:\VulkanSDK" -Directory | Select-Object -First 1
          if (-not $vulkanPath) {
            throw "Vulkan SDK installation failed - directory not found"
          }
          $vulkanSdkPath = $vulkanPath.FullName
          Write-Host "Vulkan SDK installed at: $vulkanSdkPath"
          
          "VULKAN_SDK=$vulkanSdkPath" >> $env:GITHUB_ENV
          "$vulkanSdkPath\Bin" >> $env:GITHUB_PATH
      # =================================================================

      - name: Install dependencies
        shell: bash
        run: |
          npm ci --prefix Adobe-Extension
          npm ci --prefix AutoSubs-App

      - name: Download ffmpeg binary (Windows)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          cd AutoSubs-App/src-tauri
          mkdir -p binaries
          cd binaries
          ZIP_NAME="ffmpeg-x86_64-pc-windows-msvc.zip"
          for i in 1 2 3 4 5; do
            echo "Attempt $i: downloading $ZIP_NAME..."
            if gh release download --repo tmoroney/ffmpeg-binaries --pattern "$ZIP_NAME" --clobber; then
              break
            fi
            sleep 5
          done
          unzip -jo "$ZIP_NAME"
          rm -f "$ZIP_NAME"

      - name: Build Tauri (Windows)
        shell: bash
        run: |
          cd AutoSubs-App
          npm run build:win

      - name: Collect Windows artifacts
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="AutoSubs-App/src-tauri/target/release/bundle"
          EXE_FILE=$(find "$BUNDLE_DIR" -name "*.exe" -type f | head -n1 || true)
          if [ -z "$EXE_FILE" ]; then
            echo "ERROR: Windows installer not found"
            exit 1
          fi
          cp "$EXE_FILE" "AutoSubs-windows-x86_64.exe"

      - name: Upload Windows artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: AutoSubs-windows-x86_64.exe
          token: ${{ secrets.GH_TOKEN }}
          tag_name: ${{ env.TAG }}
